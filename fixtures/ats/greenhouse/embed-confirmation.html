<!DOCTYPE html>
<!--
  Fixture: Greenhouse embed confirmation, rendered inside #grnhse_iframe after a
  successful submit (job-boards.greenhouse.io/embed/job_app/confirmation?for=<board>&token=<id>).
  Keeps the iframe height handshake so the parent page shrinks the frame to fit.
  Served at /__confirm/{{FORM_ID}}; the URL is rewritten to the real embed path,
  which is also routed to this file. Fictional employer. Local fixture only.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thank you for applying to Orchard Robotics</title>
  <link rel="stylesheet" href="/ats/greenhouse/jobboards.css">
</head>
<body style="--custom-link-color:#b5462f;--custom-button-color:#b5462f;--custom-button-hover-color:#8f3623;--custom-button-text-color:#FFFFFF">
<div id="react-portal-mount-point"></div>
<main class="main font-secondary">
  <div class="confirmation">
    <div class="image-container"><a href="https://job-boards.greenhouse.io/orchardrobotics" target="_blank" rel="noreferrer" class="logo"><span class="logo-mark" aria-hidden="true">O</span><span class="logo-text">Orchard Robotics</span></a></div>
    <div class="confirmation__content">
      <div>
        <div class="body">
          <span>
            <h1>Thank you for applying.</h1>
            <p>Your application has been received. We will review your application and contact you if there's a fit.</p>
          </span>
        </div>
        <div class="confirmation__links">
          <a href="https://job-boards.greenhouse.io/orchardrobotics" target="_top" class="btn btn--rounded">View more jobs at Orchard Robotics</a>
          <a class="link" target="_top" href="{{ORIGIN_A}}/orchardrobotics.example.com/careers/junior-full-stack-developer">Back to job post</a>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="footer" dir="ltr"><div class="footer-row"><p class="body">Powered by</p><a class="footer-logo-link" target="_blank" href="https://www.greenhouse.com" rel="noreferrer"><strong>greenhouse</strong></a></div></footer>
<script>
  if (location.pathname.indexOf('/__confirm/') === 0) history.replaceState(null, '', '/job-boards.greenhouse.io/embed/job_app/confirmation?for=orchardrobotics&token=5011223');
  (function () {
    if (window.parent === window) return;
    var post = function () { window.parent.postMessage(Math.ceil(document.documentElement.scrollHeight), '*'); };
    window.addEventListener('message', function (e) { if (e.data === 'resize') post(); });
    window.addEventListener('load', post);
    post();
    // Greenhouse asks the host page to scroll back to the frame after submit.
    window.parent.postMessage({ scrollTo: 0 }, '*');
  })();
</script>
</body>
</html>
